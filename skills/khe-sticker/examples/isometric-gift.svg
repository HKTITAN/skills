<!-- Gold for: four parts and a part that wraps. Learn: the box is one deep slab and the lid a thin one sitting on it; the ribbon is a slab deeper than the lid it lies on, so its own side carries it down the lid's edge; the bow is the top part, raised by everything under it; red carries the object and gold is the one warm accent on top of it. -->
