<!-- good: keyframes inside the file play by themselves, which is the only engine an img can run besides SMIL. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" id="spark-draw" role="img" aria-labelledby="spark-draw-title" data-home="img" fill="none">
  <title id="spark-draw-title">Spark logo</title>
  <style>
    #spark-draw .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: spark-draw-line 1s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
    #spark-draw .dot { opacity: 0; animation: spark-draw-dot 240ms ease 1s forwards; }
    @keyframes spark-draw-line { to { stroke-dashoffset: 0; } }
    @keyframes spark-draw-dot { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #spark-draw .line { animation: none; stroke-dashoffset: 0; }
      #spark-draw .dot { animation: none; opacity: 1; }
    }
  </style>
  <g id="spark-draw-mark">
    <path class="line" pathLength="1" d="M8 34 L18 24 L26 30 L38 14" stroke="var(--logo-ink, #111111)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="dot" cx="38" cy="14" r="4" fill="var(--logo-accent, #e5484d)"/>
  </g>
</svg>
