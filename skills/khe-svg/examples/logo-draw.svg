<!-- Gold for: a logo reveal by stroke draw, loaded as an img. Learn: the stroke is the cause and the dot is its effect, so the dot fades in on the frame the line reaches it (delay 1s, the line's own duration); the keyframes and the reduced-motion state both live inside the file, and reduced motion lands on the finished mark in one frame. The hex fallbacks stand in for the project's tokens. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" id="logo-draw" role="img" aria-labelledby="logo-draw-title" data-home="img" fill="none">
  <title id="logo-draw-title">Spark logo</title>
  <style>
    #logo-draw .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: logo-draw-line 1s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
    #logo-draw .dot { opacity: 0; animation: logo-draw-dot 240ms ease 1s forwards; }
    @keyframes logo-draw-line { to { stroke-dashoffset: 0; } }
    @keyframes logo-draw-dot { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #logo-draw .line { animation: none; stroke-dashoffset: 0; }
      #logo-draw .dot { animation: none; opacity: 1; }
    }
  </style>
  <g id="logo-draw-mark">
    <path class="line" pathLength="1" d="M8 34 L18 24 L26 30 L38 14" stroke="var(--logo-ink, #111111)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="dot" cx="38" cy="14" r="4" fill="var(--logo-accent, #e5484d)"/>
  </g>
</svg>
