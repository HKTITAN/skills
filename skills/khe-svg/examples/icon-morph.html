<!-- Gold for: a path morph with matching commands, inline and state-driven. Learn: every icon in the family is exactly three lines, so any state morphs to any other; the spare line parks at the centre at opacity 0; cross is plus turned 45 degrees, so it rotates and never interpolates coordinates. CSS d is the engine: confirm the project's browsers run it before shipping. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon morph: menu, plus, cross</title>
<style>
  .toggle { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; background: none; color: var(--ink, #111111); }
  #icon-morph { display: block; width: 24px; height: 24px; }

  /* One curve and one duration for every part, so the three lines read as one object. */
  #icon-morph .lines { transform-box: view-box; transform-origin: 50% 50%; transition: transform 240ms cubic-bezier(0.25, 1, 0.5, 1); }
  #icon-morph .line { transition: d 240ms cubic-bezier(0.25, 1, 0.5, 1), opacity 240ms cubic-bezier(0.25, 1, 0.5, 1); }

  /* menu: three bars */
  #icon-morph .l1 { d: path("M5 7 L19 7"); }
  #icon-morph .l2 { d: path("M5 12 L19 12"); }
  #icon-morph .l3 { d: path("M5 17 L19 17"); }

  /* plus: a vertical, a horizontal, and the spare parked at the centre */
  #icon-morph[data-icon="plus"] .l1, #icon-morph[data-icon="cross"] .l1 { d: path("M12 5 L12 19"); }
  #icon-morph[data-icon="plus"] .l3, #icon-morph[data-icon="cross"] .l3 { d: path("M12 12 L12 12"); opacity: 0; }

  /* cross: the same coordinates as plus, turned */
  #icon-morph[data-icon="cross"] .lines { transform: rotate(45deg); }

  @media (prefers-reduced-motion: reduce) {
    #icon-morph .lines, #icon-morph .line { transition: none; }
  }
</style>
</head>
<body>
<button class="toggle" type="button" aria-label="Menu">
  <svg id="icon-morph" data-icon="menu" data-home="inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" focusable="false">
    <g class="lines">
      <path class="line l1" d="M5 7 L19 7"/>
      <path class="line l2" d="M5 12 L19 12"/>
      <path class="line l3" d="M5 17 L19 17"/>
    </g>
  </svg>
</button>
<script>
  const order = ["menu", "plus", "cross"];
  const label = { menu: "Menu", plus: "Add", cross: "Close" };
  const button = document.querySelector(".toggle");
  const icon = document.getElementById("icon-morph");
  button.addEventListener("click", () => {
    const next = order[(order.indexOf(icon.dataset.icon) + 1) % order.length];
    icon.dataset.icon = next;
    button.setAttribute("aria-label", label[next]);
  });
</script>
</body>
</html>
