<!-- Gold for: a one-shot story, self-contained for a page or a README. Learn: the story is one jump. The character crouches to 0.9, leaves the ground on frame 6, peaks 72 units up on frame 17 and lands on frame 28 with an accelerating curve; it squashes to 0.84 from its base and settles in swings that halve; the arms drop from their shoulders 6 frames after the landing, the eyes squint as the same two shapes, and four dust marks are switched on at the landing and off again, never faded. One transform per named group. The die-cut rides inside the jumping group and covers the arms' swing. It plays once (1 both) and ends on the rested still, so a page can add its idle after 2.6s. With reduced motion the file is that still. -->
