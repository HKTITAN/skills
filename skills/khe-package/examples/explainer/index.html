<!doctype html>
<!--
  Gold: an explainer page for render.mjs. One comparison scene: the same 400 ms open with two curves,
  mirrored around the centre and triggered on the same frame. Every style is set from t by render(t);
  nothing here runs on its own clock (no CSS transitions, no timers, no Date.now()).
  Cycles: twice at normal speed, then once at 4x slow motion, left open until the end.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ease-out vs linear</title>
<style>
  html, body { margin: 0; background: #fff; }
  body { width: 1080px; height: 1080px; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #18181b; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 96px; }
  .side { display: grid; justify-items: center; gap: 40px; }
  .label { font: 500 26px/1 ui-monospace, "SF Mono", Consolas, monospace; color: #71717a; }
  .menu { width: 340px; height: 300px; border-radius: 20px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 12px 32px rgba(0,0,0,.10); transform-origin: top center; display: grid; align-content: start; gap: 6px; padding: 18px; box-sizing: border-box; will-change: transform, opacity; }
  .item { height: 44px; border-radius: 10px; background: #f4f4f5; }
  .trigger { width: 200px; height: 64px; border-radius: 16px; background: #18181b; color: #fff; font: 600 24px/64px system-ui, sans-serif; text-align: center; will-change: transform; }
  .slow { position: absolute; top: 72px; left: 0; right: 0; text-align: center; font: 500 26px/1 ui-monospace, Consolas, monospace; color: #71717a; }
</style>
</head>
<body>
  <div class="slow" id="slow">4× slower</div>
  <div class="row">
    <div class="side"><div class="label">linear</div><div class="trigger" id="t1">Open</div><div class="menu" id="m1"><div class="item"></div><div class="item"></div><div class="item"></div><div class="item"></div></div></div>
    <div class="side"><div class="label">ease-out</div><div class="trigger" id="t2">Open</div><div class="menu" id="m2"><div class="item"></div><div class="item"></div><div class="item"></div><div class="item"></div></div></div>
  </div>
<script>
  window.DURATION = 7
  const OPEN = 0.4
  // [openAt, closeAt, slowdown]: twice at 1x, then once at 4x, left open.
  const CYCLES = [[0.4, 1.4, 1], [2.3, 3.3, 1], [4.2, null, 4]]

  // cubic-bezier solver: x(t) -> t by Newton steps, then y(t).
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by
    const X = (t) => ((ax * t + bx) * t + cx) * t
    const Y = (t) => ((ay * t + by) * t + cy) * t
    const dX = (t) => (3 * ax * t + 2 * bx) * t + cx
    return (x) => { let t = x; for (let i = 0; i < 8; i++) { const d = dX(t); if (Math.abs(d) < 1e-6) break; t -= (X(t) - x) / d } return Y(Math.min(1, Math.max(0, t))) }
  }
  const linear = (x) => x
  const easeOut = bezier(0.23, 1, 0.32, 1)

  // How open the menu is at t: 0 closed, 1 open. Close is 0.8x the open duration.
  function openness(t, curve) {
    let v = 0
    for (const [at, close, slow] of CYCLES) {
      const d = OPEN * slow
      if (t >= at) v = curve(Math.min(1, (t - at) / d))
      if (close !== null && t >= close) v = 1 - curve(Math.min(1, (t - close) / (d * 0.8)))
    }
    return v
  }
  // A press before each open: 1 -> 0.97 over 90 ms, back over 160 ms, peak on the open frame.
  function press(t) {
    for (const [at] of CYCLES) {
      const d = t - (at - 0.09)
      if (d >= 0 && d < 0.09) return 1 - 0.03 * (d / 0.09)
      if (d >= 0.09 && d < 0.25) return 0.97 + 0.03 * ((d - 0.09) / 0.16)
    }
    return 1
  }
  function set(menu, trigger, v, p) {
    menu.style.opacity = v
    menu.style.transform = `scale(${0.95 + 0.05 * v}) translateY(${(1 - v) * -8}px)`
    trigger.style.transform = `scale(${p})`
  }
  window.render = (t) => {
    set(document.getElementById('m1'), document.getElementById('t1'), openness(t, linear), press(t))
    set(document.getElementById('m2'), document.getElementById('t2'), openness(t, easeOut), press(t))
    document.getElementById('slow').style.opacity = t >= 4.1 ? 1 : 0
  }
  window.render(0)
</script>
</body>
</html>
