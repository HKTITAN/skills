<!-- Gold for: a one-shot story on a sticker with a die-cut. Learn: the story is one stamp. The tick starts lifted 64 units, drops with an accelerating curve and lands on frame 16; the whole badge takes the hit from its base, squashing to 0.9 and settling in swings that halve; three impact marks are switched on at the hit. The die-cut sits inside the group that squashes, and the lifted tick stays inside it. It plays once and ends on the rested still. -->
