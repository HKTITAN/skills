<!-- zoom-locked: the viewport blocks pinch zoom for everyone, to hide a zoom that the 16px input already prevents. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Sign in</title>
  <style>
    input {
      min-height: 44px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <form action="/session" method="post">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email">
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
