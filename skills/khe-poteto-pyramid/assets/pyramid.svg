<svg xmlns="http://www.w3.org/2000/svg" id="poteto-pyramid" viewBox="0 0 896 368" role="img" aria-labelledby="poteto-pyramid-title poteto-pyramid-desc">
  <title id="poteto-pyramid-title">The poteto pyramid and where each layer hands off</title>
  <desc id="poteto-pyramid-desc">A correction goes to the highest layer that can hold it, and each layer names the skills that take its deep part.</desc>
  <defs>
    <marker id="poteto-pyramid-arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path class="head" d="M0 1 L8 4 L0 7 Z"/>
    </marker>
  </defs>
  <style>
    #poteto-pyramid { --page: #fdfdfc; --surface: #ffffff; --ink: #21201c; --ink-2: #63635e; --ink-3: #82827c; --line: #cfceca; --rule: #e9e8e6; --heading: #8d8d86; --hl: #ffe556; --hl: oklch(0.92 0.16 98); --hl-ink: #21201c; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      #poteto-pyramid { --page: #111110; --surface: #222221; --ink: #ffffff; --ink-2: #eeeeec; --ink-3: #b5b3ad; --line: #494844; --rule: #31312e; --heading: #b5b3ad; --hl: #eed04c; --hl: oklch(0.86 0.15 96); --hl-ink: #111110; }
    }
    #poteto-pyramid .paper { fill: var(--page); }
    #poteto-pyramid .edge { fill: none; stroke: var(--ink-3); stroke-width: 1.25; }
    #poteto-pyramid .edge.dashed { stroke-dasharray: 5 4; }
    #poteto-pyramid .head { fill: var(--ink-3); }
    #poteto-pyramid .mask { fill: var(--page); }
    #poteto-pyramid .label { fill: var(--ink-3); font-size: 9px; }
    #poteto-pyramid .node rect { fill: var(--surface); stroke: var(--line); }
    #poteto-pyramid .node.strong rect { stroke: var(--ink); }
    #poteto-pyramid .node.quiet rect { fill: var(--page); stroke-dasharray: 5 4; }
    #poteto-pyramid .node rect.hl { fill: var(--hl); stroke: none; }
    #poteto-pyramid .name { fill: var(--ink); font-size: 12px; font-weight: 600; }
    #poteto-pyramid .name.on { fill: var(--hl-ink); }
    #poteto-pyramid .sub { fill: var(--ink-2); font-size: 10px; }
    #poteto-pyramid .path { fill: var(--ink-3); font-size: 10px; font-family: "Geist Mono", ui-monospace, monospace; }
    #poteto-pyramid .skill { fill: var(--ink); font-size: 12px; }
    #poteto-pyramid .caps { fill: var(--heading); font-size: 10px; font-weight: 900; letter-spacing: 0.06em; }
    #poteto-pyramid .callout { fill: var(--ink-2); font-size: 10px; }
    #poteto-pyramid .zone { fill: none; stroke: var(--line); stroke-dasharray: 2 4; }
    #poteto-pyramid .rule { stroke: var(--rule); }
    #poteto-pyramid .legend text { fill: var(--ink-2); font-size: 10px; }
  </style>
  <rect class="paper" width="896" height="368"/>
  <g class="edges">
    <path class="edge " d="M36 64 V320" marker-end="url(#poteto-pyramid-arrow)"/>
  </g>
  <g class="labels">
    <rect class="mask" x="44" y="178" width="31" height="14"/>
    <text class="label" x="48" y="188">cost</text>
  </g>
  <text class="caps" x="72" y="40">LAYER, TOP FIRST</text>
  <text class="caps" x="456" y="40">THE DEEP PART GOES TO</text>
  <line class="rule" x1="456" y1="112" x2="864" y2="112"/>
  <line class="rule" x1="456" y1="168" x2="864" y2="168"/>
  <line class="rule" x1="456" y1="224" x2="864" y2="224"/>
  <line class="rule" x1="456" y1="280" x2="864" y2="280"/>
  <g class="nodes">
    <g class="node strong">
      <rect x="72" y="56" width="352" height="48" rx="6"/>
      <rect class="hl" x="80" y="65" width="65" height="16" rx="2"/>
      <text class="name on" x="84" y="77">Codebase</text>
      <text class="sub" x="84" y="93">architecture, API design, folders, deletion</text>
    </g>
    <g class="node ">
      <rect x="100" y="112" width="296" height="48" rx="6"/>
      <text class="name" x="112" y="133">Static analysis</text>
      <text class="sub" x="112" y="149">lints, types, compilers, tests, CI</text>
    </g>
    <g class="node ">
      <rect x="128" y="168" width="240" height="48" rx="6"/>
      <text class="name" x="140" y="189">Verification</text>
      <text class="sub" x="140" y="205">run the app, formal models</text>
    </g>
    <g class="node quiet">
      <rect x="156" y="224" width="184" height="48" rx="6"/>
      <text class="name" x="168" y="245">Prose</text>
      <text class="sub" x="168" y="261">judgment calls only</text>
    </g>
    <g class="node quiet">
      <rect x="184" y="280" width="128" height="48" rx="6"/>
      <text class="name" x="196" y="301">Human review</text>
      <text class="sub" x="196" y="317">feeds back up</text>
    </g>
  </g>
  <g class="handoffs">
    <text class="skill" x="456" y="77">codebase-design · improve-codebase-architecture</text>
    <text class="sub" x="456" y="93">Matt Pocock</text>
    <text class="skill" x="456" y="133">no-comments · setup-pre-commit · git-guardrails</text>
    <text class="sub" x="456" y="149">Lauren Tan · Matt Pocock</text>
    <text class="skill" x="456" y="189">create-verification-skill · statechart · khe-demo</text>
    <text class="sub" x="456" y="205">Lauren Tan, and her formal-verification pair · here</text>
    <text class="skill" x="456" y="245">learn-taste · correct</text>
    <text class="sub" x="456" y="261">Emil Kowalski · Lauren Tan</text>
    <text class="skill" x="456" y="301">interrogate · pocock-code-review · khe-ui</text>
    <text class="sub" x="456" y="317">Lauren Tan · Matt Pocock · here</text>
  </g>
  <text class="callout" x="72" y="352">Start at the top band. A layer gets a correction only when every layer above it could not hold it.</text>
</svg>
