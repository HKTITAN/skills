<!-- Gold for: an upright object. Learn: a cup that stands up is one silhouette on one leaned plane, with one side falling from it, never a face on top of a slab; the handles are holes in that silhouette, so the ground shows through them; the base is a second slab in purple under the gold, and the plaque is a third, raised 6 units. -->
