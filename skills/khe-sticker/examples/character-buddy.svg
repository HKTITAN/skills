<!-- Gold for: a character sticker. Learn: one emotion, carried by the pose first and the face second: arms up, eyes open, mouth open; the body, arms and feet are slabs on the set's one tilt, the limbs behind the body so their joins never show; eyes, mouth and cheeks are their own named parts lying on the face, so each can move later; blue carries the character and red, the one warm accent, is only the cheeks. -->
