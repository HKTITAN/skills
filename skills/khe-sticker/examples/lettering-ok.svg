<!-- Gold for: a lettering sticker. Learn: the word is the object, so there is nothing else in the frame; the letters are outlines on one stroke weight, never live text; they lean on the set's one tilt and stand on a hard block in the side shade, never a blurred shadow; gold says the word and red, the second hue, says the exclamation; data-text and the title carry the word for anyone who cannot see it. -->
