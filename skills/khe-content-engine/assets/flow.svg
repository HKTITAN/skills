<svg xmlns="http://www.w3.org/2000/svg" id="khe-content-engine-flow" viewBox="0 0 896 472" role="img" aria-labelledby="khe-content-engine-flow-title khe-content-engine-flow-desc">
  <title id="khe-content-engine-flow-title">How khe-content-engine runs</title>
  <desc id="khe-content-engine-flow-desc">Posts you wrote become an engine of linked nodes; one idea runs through it into a draft per platform, a review sends a wrong line to the node that caused it, and a person posts.</desc>
  <defs>
    <marker id="khe-content-engine-flow-arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path class="head" d="M0 1 L8 4 L0 7 Z"/>
    </marker>
  </defs>
  <style>
    #khe-content-engine-flow { --page: #fdfdfc; --surface: #ffffff; --ink: #21201c; --ink-2: #63635e; --ink-3: #82827c; --line: #cfceca; --rule: #e9e8e6; --heading: #8d8d86; --hl: #ffe556; --hl: oklch(0.92 0.16 98); --hl-ink: #21201c; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      #khe-content-engine-flow { --page: #111110; --surface: #222221; --ink: #ffffff; --ink-2: #eeeeec; --ink-3: #b5b3ad; --line: #494844; --rule: #31312e; --heading: #b5b3ad; --hl: #eed04c; --hl: oklch(0.86 0.15 96); --hl-ink: #111110; }
    }
    #khe-content-engine-flow .paper { fill: var(--page); }
    #khe-content-engine-flow .edge { fill: none; stroke: var(--ink-3); stroke-width: 1.25; }
    #khe-content-engine-flow .edge.dashed { stroke-dasharray: 5 4; }
    #khe-content-engine-flow .head { fill: var(--ink-3); }
    #khe-content-engine-flow .mask { fill: var(--page); }
    #khe-content-engine-flow .label { fill: var(--ink-3); font-size: 9px; }
    #khe-content-engine-flow .node rect { fill: var(--surface); stroke: var(--line); }
    #khe-content-engine-flow .node.strong rect { stroke: var(--ink); }
    #khe-content-engine-flow .node.quiet rect { fill: var(--page); stroke-dasharray: 5 4; }
    #khe-content-engine-flow .node rect.hl { fill: var(--hl); stroke: none; }
    #khe-content-engine-flow .name { fill: var(--ink); font-size: 12px; font-weight: 600; }
    #khe-content-engine-flow .name.on { fill: var(--hl-ink); }
    #khe-content-engine-flow .sub { fill: var(--ink-2); font-size: 10px; }
    #khe-content-engine-flow .path { fill: var(--ink-3); font-size: 10px; font-family: "Geist Mono", ui-monospace, monospace; }
    #khe-content-engine-flow .skill { fill: var(--ink); font-size: 12px; }
    #khe-content-engine-flow .caps { fill: var(--heading); font-size: 10px; font-weight: 900; letter-spacing: 0.06em; }
    #khe-content-engine-flow .callout { fill: var(--ink-2); font-size: 10px; }
    #khe-content-engine-flow .zone { fill: none; stroke: var(--line); stroke-dasharray: 2 4; }
    #khe-content-engine-flow .rule { stroke: var(--rule); }
    #khe-content-engine-flow .legend text { fill: var(--ink-2); font-size: 10px; }
  </style>
  <rect class="paper" width="896" height="472"/>
  <g class="edges">
    <path class="edge " d="M176 228 H208" marker-end="url(#khe-content-engine-flow-arrow)"/>
    <path class="edge " d="M352 228 H384" marker-end="url(#khe-content-engine-flow-arrow)"/>
    <path class="edge " d="M528 228 H560" marker-end="url(#khe-content-engine-flow-arrow)"/>
    <path class="edge " d="M704 228 H736" marker-end="url(#khe-content-engine-flow-arrow)"/>
    <path class="edge " d="M432 128 V200" marker-end="url(#khe-content-engine-flow-arrow)"/>
    <path class="edge " d="M600 128 V156 Q600 164 592 164 H488 Q480 164 480 172 V200" marker-end="url(#khe-content-engine-flow-arrow)"/>
    <path class="edge " d="M632 256 V328" marker-end="url(#khe-content-engine-flow-arrow)"/>
    <path class="edge dashed" d="M560 356 H288 Q280 356 280 348 V256" marker-end="url(#khe-content-engine-flow-arrow)"/>
  </g>
  <g class="labels">
    <rect class="mask" x="512" y="142" width="53" height="14"/>
    <text class="label" x="516" y="152">the rest</text>
    <rect class="mask" x="640" y="285" width="76" height="14"/>
    <text class="label" x="644" y="295">a wrong line</text>
  </g>
  <text class="caps" x="32" y="48">SET UP ONCE, THEN ONE IDEA BECOMES A DRAFT PER PLATFORM</text>
  <g class="nodes">
    <g class="node quiet">
      <rect x="384" y="72" width="144" height="56" rx="6"/>
      <text class="name" x="396" y="96">khe-brain-harshit</text>
      <text class="sub" x="396" y="112">his posted views</text>
    </g>
    <g class="node quiet">
      <rect x="560" y="72" width="144" height="56" rx="6"/>
      <text class="name" x="572" y="96">khe-package</text>
      <text class="sub" x="572" y="112">the first line</text>
    </g>
    <g class="node ">
      <rect x="32" y="200" width="144" height="56" rx="6"/>
      <text class="name" x="44" y="224">Your writing</text>
      <text class="sub" x="44" y="240">posts you wrote</text>
    </g>
    <g class="node strong">
      <rect x="208" y="200" width="144" height="56" rx="6"/>
      <rect class="hl" x="216" y="212" width="79" height="16" rx="2"/>
      <text class="name on" x="220" y="224">The engine</text>
      <text class="sub" x="220" y="240">small linked nodes</text>
    </g>
    <g class="node strong">
      <rect x="384" y="200" width="144" height="56" rx="6"/>
      <rect class="hl" x="392" y="212" width="58" height="16" rx="2"/>
      <text class="name on" x="396" y="224">The run</text>
      <text class="sub" x="396" y="240">a draft per platform</text>
    </g>
    <g class="node ">
      <rect x="560" y="200" width="144" height="56" rx="6"/>
      <text class="name" x="572" y="224">Review</text>
      <text class="sub" x="572" y="240">against the engine</text>
    </g>
    <g class="node ">
      <rect x="736" y="200" width="144" height="56" rx="6"/>
      <text class="name" x="748" y="224">A person posts</text>
      <text class="sub" x="748" y="240">never the skill</text>
    </g>
    <g class="node ">
      <rect x="560" y="328" width="144" height="56" rx="6"/>
      <text class="name" x="572" y="352">Tune the node</text>
      <text class="sub" x="572" y="368">dated, then rerun</text>
    </g>
  </g>
  <text class="callout" x="32" y="416">Pictures go elsewhere: the product to khe-demo, a film to khe-launch-film, stickers to khe-sticker.</text>
  <g class="legend" transform="translate(32 448)">
    <line class="rule" x1="0" y1="-16" x2="832" y2="-16"/>
    <path class="edge" d="M0 0 H24"/>
    <text x="32" y="4">next step</text>
    <path class="edge dashed" d="M96 0 H120"/>
    <text x="128" y="4">back to the node that caused it</text>
  </g>
</svg>
