<svg xmlns="http://www.w3.org/2000/svg" id="khe-design-tokens-flow" viewBox="0 0 896 432" role="img" aria-labelledby="khe-design-tokens-flow-title khe-design-tokens-flow-desc">
  <title id="khe-design-tokens-flow-title">How khe-design-tokens runs</title>
  <desc id="khe-design-tokens-flow-desc">khe-auto runs it first; it finds the contract, maps and threads the tokens, gates them and hands the gaps to khe-ui and a sound group to khe-sound.</desc>
  <defs>
    <marker id="khe-design-tokens-flow-arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path class="head" d="M0 1 L8 4 L0 7 Z"/>
    </marker>
  </defs>
  <style>
    #khe-design-tokens-flow { --page: #fdfdfc; --surface: #ffffff; --ink: #21201c; --ink-2: #63635e; --ink-3: #82827c; --line: #cfceca; --rule: #e9e8e6; --heading: #8d8d86; --hl: #ffe556; --hl: oklch(0.92 0.16 98); --hl-ink: #21201c; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      #khe-design-tokens-flow { --page: #111110; --surface: #222221; --ink: #ffffff; --ink-2: #eeeeec; --ink-3: #b5b3ad; --line: #494844; --rule: #31312e; --heading: #b5b3ad; --hl: #eed04c; --hl: oklch(0.86 0.15 96); --hl-ink: #111110; }
    }
    #khe-design-tokens-flow .paper { fill: var(--page); }
    #khe-design-tokens-flow .edge { fill: none; stroke: var(--ink-3); stroke-width: 1.25; }
    #khe-design-tokens-flow .edge.dashed { stroke-dasharray: 5 4; }
    #khe-design-tokens-flow .head { fill: var(--ink-3); }
    #khe-design-tokens-flow .mask { fill: var(--page); }
    #khe-design-tokens-flow .label { fill: var(--ink-3); font-size: 9px; }
    #khe-design-tokens-flow .node rect { fill: var(--surface); stroke: var(--line); }
    #khe-design-tokens-flow .node.strong rect { stroke: var(--ink); }
    #khe-design-tokens-flow .node.quiet rect { fill: var(--page); stroke-dasharray: 5 4; }
    #khe-design-tokens-flow .node rect.hl { fill: var(--hl); stroke: none; }
    #khe-design-tokens-flow .name { fill: var(--ink); font-size: 12px; font-weight: 600; }
    #khe-design-tokens-flow .name.on { fill: var(--hl-ink); }
    #khe-design-tokens-flow .sub { fill: var(--ink-2); font-size: 10px; }
    #khe-design-tokens-flow .path { fill: var(--ink-3); font-size: 10px; font-family: "Geist Mono", ui-monospace, monospace; }
    #khe-design-tokens-flow .skill { fill: var(--ink); font-size: 12px; }
    #khe-design-tokens-flow .caps { fill: var(--heading); font-size: 10px; font-weight: 900; letter-spacing: 0.06em; }
    #khe-design-tokens-flow .callout { fill: var(--ink-2); font-size: 10px; }
    #khe-design-tokens-flow .zone { fill: none; stroke: var(--line); stroke-dasharray: 2 4; }
    #khe-design-tokens-flow .rule { stroke: var(--rule); }
    #khe-design-tokens-flow .legend text { fill: var(--ink-2); font-size: 10px; }
  </style>
  <rect class="paper" width="896" height="432"/>
  <g class="edges">
    <path class="edge " d="M152 100 H248" marker-end="url(#khe-design-tokens-flow-arrow)"/>
    <path class="edge " d="M408 100 H464" marker-end="url(#khe-design-tokens-flow-arrow)"/>
    <path class="edge " d="M624 100 H680" marker-end="url(#khe-design-tokens-flow-arrow)"/>
    <path class="edge " d="M760 128 V200" marker-end="url(#khe-design-tokens-flow-arrow)"/>
    <path class="edge dashed" d="M808 200 V128" marker-end="url(#khe-design-tokens-flow-arrow)"/>
    <path class="edge " d="M680 228 H624" marker-end="url(#khe-design-tokens-flow-arrow)"/>
    <path class="edge dashed" d="M328 128 V200" marker-end="url(#khe-design-tokens-flow-arrow)"/>
    <path class="edge " d="M488 256 V328" marker-end="url(#khe-design-tokens-flow-arrow)"/>
    <path class="edge " d="M600 256 V328" marker-end="url(#khe-design-tokens-flow-arrow)"/>
  </g>
  <g class="labels">
    <rect class="mask" x="160" y="78" width="81" height="14"/>
    <text class="label" x="164" y="88">runs it first</text>
    <rect class="mask" x="338" y="156" width="64" height="14"/>
    <text class="label" x="342" y="166">none found</text>
    <rect class="mask" x="408" y="284" width="70" height="14"/>
    <text class="label" x="412" y="294">a gap in it</text>
    <rect class="mask" x="610" y="284" width="76" height="14"/>
    <text class="label" x="614" y="294">tokens.sound</text>
  </g>
  <text class="caps" x="32" y="48">CONTRACT FIRST, THEN EVERY VALUE FROM IT</text>
  <g class="nodes">
    <g class="node ">
      <rect x="32" y="72" width="120" height="56" rx="6"/>
      <text class="name" x="44" y="96">khe-auto</text>
      <text class="sub" x="44" y="112">routes the job</text>
    </g>
    <g class="node strong">
      <rect x="248" y="72" width="160" height="56" rx="6"/>
      <rect class="hl" x="256" y="84" width="129" height="16" rx="2"/>
      <text class="name on" x="260" y="96">Find the contract</text>
      <text class="sub" x="260" y="112">.design, then DESIGN.md</text>
    </g>
    <g class="node ">
      <rect x="464" y="72" width="160" height="56" rx="6"/>
      <rect class="hl" x="472" y="84" width="72" height="16" rx="2"/>
      <text class="name on" x="476" y="96">Token map</text>
      <text class="sub" x="476" y="112">drift, before any edit</text>
    </g>
    <g class="node ">
      <rect x="680" y="72" width="160" height="56" rx="6"/>
      <text class="name" x="692" y="96">Thread it</text>
      <text class="sub" x="692" y="112">CSS vars, theme, props</text>
    </g>
    <g class="node ">
      <rect x="680" y="200" width="160" height="56" rx="6"/>
      <text class="name" x="692" y="224">The gate</text>
      <text class="sub" x="692" y="240">token-check, the folder</text>
    </g>
    <g class="node ">
      <rect x="464" y="200" width="160" height="56" rx="6"/>
      <text class="name" x="476" y="224">TOKENS.md</text>
      <text class="sub" x="476" y="240">literals, with reasons</text>
    </g>
    <g class="node quiet">
      <rect x="248" y="200" width="160" height="56" rx="6"/>
      <text class="name" x="260" y="224">No contract</text>
      <text class="sub" x="260" y="240">say so, offer one</text>
    </g>
    <g class="node ">
      <rect x="352" y="328" width="160" height="56" rx="6"/>
      <text class="name" x="364" y="352">khe-ui</text>
      <text class="sub" x="364" y="368">the gaps, the feel</text>
    </g>
    <g class="node ">
      <rect x="560" y="328" width="160" height="56" rx="6"/>
      <text class="name" x="572" y="352">khe-sound</text>
      <text class="sub" x="572" y="368">its sound values</text>
    </g>
  </g>
  <g class="legend" transform="translate(32 408)">
    <line class="rule" x1="0" y1="-16" x2="832" y2="-16"/>
    <path class="edge" d="M0 0 H24"/>
    <text x="32" y="4">next step, or a hand-off</text>
    <path class="edge dashed" d="M176 0 H200"/>
    <text x="208" y="4">when a step fails: no contract, or a drift line</text>
  </g>
</svg>
