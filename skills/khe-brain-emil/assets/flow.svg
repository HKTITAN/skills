<svg xmlns="http://www.w3.org/2000/svg" id="khe-brain-emil-flow" viewBox="0 0 896 436" role="img" aria-labelledby="khe-brain-emil-flow-title khe-brain-emil-flow-desc">
  <title id="khe-brain-emil-flow-title">How khe-brain-emil runs</title>
  <desc id="khe-brain-emil-flow-desc">A question routed here is answered only from Emil Kowalski's corpus, checked for silence and disagreement, cited, ended with what is not covered, and gated; other jobs go to the neighbouring skills.</desc>
  <defs>
    <marker id="khe-brain-emil-flow-arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path class="head" d="M0 1 L8 4 L0 7 Z"/>
    </marker>
  </defs>
  <style>
    #khe-brain-emil-flow { --page: #fdfdfc; --surface: #ffffff; --ink: #21201c; --ink-2: #63635e; --ink-3: #82827c; --line: #cfceca; --rule: #e9e8e6; --heading: #8d8d86; --hl: #ffe556; --hl: oklch(0.92 0.16 98); --hl-ink: #21201c; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      #khe-brain-emil-flow { --page: #111110; --surface: #222221; --ink: #ffffff; --ink-2: #eeeeec; --ink-3: #b5b3ad; --line: #494844; --rule: #31312e; --heading: #b5b3ad; --hl: #eed04c; --hl: oklch(0.86 0.15 96); --hl-ink: #111110; }
    }
    #khe-brain-emil-flow .paper { fill: var(--page); }
    #khe-brain-emil-flow .edge { fill: none; stroke: var(--ink-3); stroke-width: 1.25; }
    #khe-brain-emil-flow .edge.dashed { stroke-dasharray: 5 4; }
    #khe-brain-emil-flow .head { fill: var(--ink-3); }
    #khe-brain-emil-flow .mask { fill: var(--page); }
    #khe-brain-emil-flow .label { fill: var(--ink-3); font-size: 9px; }
    #khe-brain-emil-flow .node rect { fill: var(--surface); stroke: var(--line); }
    #khe-brain-emil-flow .node.strong rect { stroke: var(--ink); }
    #khe-brain-emil-flow .node.quiet rect { fill: var(--page); stroke-dasharray: 5 4; }
    #khe-brain-emil-flow .node rect.hl { fill: var(--hl); stroke: none; }
    #khe-brain-emil-flow .name { fill: var(--ink); font-size: 12px; font-weight: 600; }
    #khe-brain-emil-flow .name.on { fill: var(--hl-ink); }
    #khe-brain-emil-flow .sub { fill: var(--ink-2); font-size: 10px; }
    #khe-brain-emil-flow .path { fill: var(--ink-3); font-size: 10px; font-family: "Geist Mono", ui-monospace, monospace; }
    #khe-brain-emil-flow .skill { fill: var(--ink); font-size: 12px; }
    #khe-brain-emil-flow .caps { fill: var(--heading); font-size: 10px; font-weight: 900; letter-spacing: 0.06em; }
    #khe-brain-emil-flow .callout { fill: var(--ink-2); font-size: 10px; }
    #khe-brain-emil-flow .zone { fill: none; stroke: var(--line); stroke-dasharray: 2 4; }
    #khe-brain-emil-flow .rule { stroke: var(--rule); }
    #khe-brain-emil-flow .legend text { fill: var(--ink-2); font-size: 10px; }
  </style>
  <rect class="paper" width="896" height="436"/>
  <g class="edges">
    <path class="edge " d="M192 100 H248" marker-end="url(#khe-brain-emil-flow-arrow)"/>
    <path class="edge " d="M408 100 H464" marker-end="url(#khe-brain-emil-flow-arrow)"/>
    <path class="edge " d="M624 100 H680" marker-end="url(#khe-brain-emil-flow-arrow)"/>
    <path class="edge " d="M760 128 V200" marker-end="url(#khe-brain-emil-flow-arrow)"/>
    <path class="edge " d="M680 228 H624" marker-end="url(#khe-brain-emil-flow-arrow)"/>
    <path class="edge " d="M464 228 H408" marker-end="url(#khe-brain-emil-flow-arrow)"/>
    <path class="edge dashed" d="M112 128 V200" marker-end="url(#khe-brain-emil-flow-arrow)"/>
    <path class="edge dashed" d="M760 256 V328" marker-end="url(#khe-brain-emil-flow-arrow)"/>
  </g>
  <g class="labels">
    <rect class="mask" x="194" y="78" width="53" height="14"/>
    <text class="label" x="198" y="88">reported</text>
    <rect class="mask" x="768" y="157" width="87" height="14"/>
    <text class="label" x="772" y="167">lines, or none</text>
    <rect class="mask" x="120" y="157" width="48" height="14"/>
    <text class="label" x="124" y="167">applied</text>
    <rect class="mask" x="768" y="285" width="76" height="14"/>
    <text class="label" x="772" y="295">to change it</text>
  </g>
  <text class="caps" x="32" y="48">ROUTED IN, ANSWERED FROM THE CORPUS, GATED, HANDED ON</text>
  <g class="nodes">
    <g class="node quiet">
      <rect x="32" y="72" width="160" height="56" rx="6"/>
      <text class="name" x="44" y="96">khe-auto</text>
      <text class="sub" x="44" y="112">routes the request</text>
    </g>
    <g class="node strong">
      <rect x="248" y="72" width="160" height="56" rx="6"/>
      <text class="name" x="260" y="96">The question</text>
      <text class="sub" x="260" y="112">question, test, who said</text>
    </g>
    <g class="node ">
      <rect x="464" y="72" width="160" height="56" rx="6"/>
      <rect class="hl" x="472" y="84" width="108" height="16" rx="2"/>
      <text class="name on" x="476" y="96">10 theme files</text>
      <text class="sub" x="476" y="112">13 articles, 6 quotes</text>
    </g>
    <g class="node ">
      <rect x="680" y="72" width="160" height="56" rx="6"/>
      <text class="name" x="692" y="96">Gap check</text>
      <text class="sub" x="692" y="112">disagreements, silent</text>
    </g>
    <g class="node strong">
      <rect x="680" y="200" width="160" height="56" rx="6"/>
      <rect class="hl" x="688" y="212" width="87" height="16" rx="2"/>
      <text class="name on" x="692" y="224">Cited reply</text>
      <text class="sub" x="692" y="240">[n] and Source: [n]</text>
    </g>
    <g class="node ">
      <rect x="464" y="200" width="160" height="56" rx="6"/>
      <text class="name" x="476" y="224">Not in his writing:</text>
      <text class="sub" x="476" y="240">what no article covers</text>
    </g>
    <g class="node ">
      <rect x="248" y="200" width="160" height="56" rx="6"/>
      <text class="name" x="260" y="224">brain-check</text>
      <text class="sub" x="260" y="240">--gate until passed</text>
    </g>
    <g class="node quiet">
      <rect x="32" y="200" width="160" height="56" rx="6"/>
      <text class="name" x="44" y="224">emil-design-eng</text>
      <text class="sub" x="44" y="240">his own skill</text>
    </g>
    <g class="node quiet">
      <rect x="680" y="328" width="160" height="56" rx="6"/>
      <text class="name" x="692" y="352">khe-ui</text>
      <text class="sub" x="692" y="368">builds and reviews</text>
    </g>
  </g>
  <text class="callout" x="32" y="360">Corpus: 13 articles and one index page on emilkowal.ski. A quotation must be one of the six in quotes.md.</text>
  <g class="legend" transform="translate(32 412)">
    <line class="rule" x1="0" y1="-16" x2="832" y2="-16"/>
    <path class="edge" d="M0 0 H24"/>
    <text x="32" y="4">next step</text>
    <path class="edge dashed" d="M96 0 H120"/>
    <text x="128" y="4">the job leaves this skill</text>
  </g>
</svg>
