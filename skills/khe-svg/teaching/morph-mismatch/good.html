<!-- good: the square is drawn on the circle's budget, M + 4 C + Z, with straight cubics, so every point has a partner to travel to. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shape morph: circle to square</title>
<style>
  .toggle { width: 44px; height: 44px; padding: 10px; border: 0; background: none; color: var(--ink, #111111); }
  #shape-morph { display: block; width: 24px; height: 24px; }
  #shape-morph .shape { d: path("M4 12 C4 7 8 4 12 4 C16 4 20 7 20 12 C20 17 16 20 12 20 C8 20 4 17 4 12 Z"); transition: d 240ms cubic-bezier(0.25, 1, 0.5, 1); }
  #shape-morph[data-state="square"] .shape { d: path("M4 4 C4 4 12 4 12 4 C12 4 20 4 20 4 C20 4 20 20 20 20 C20 20 4 20 4 20 Z"); }
  @media (prefers-reduced-motion: reduce) {
    #shape-morph .shape { transition: none; }
  }
</style>
</head>
<body>
<button class="toggle" type="button" aria-label="Stop" aria-pressed="false">
  <svg id="shape-morph" data-state="circle" data-home="inline" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
    <path class="shape" d="M4 12 C4 7 8 4 12 4 C16 4 20 7 20 12 C20 17 16 20 12 20 C8 20 4 17 4 12 Z"/>
  </svg>
</button>
<script>
  const button = document.querySelector(".toggle");
  const icon = document.getElementById("shape-morph");
  button.addEventListener("click", () => {
    const square = icon.dataset.state !== "square";
    icon.dataset.state = square ? "square" : "circle";
    button.setAttribute("aria-pressed", String(square));
  });
</script>
</body>
</html>
