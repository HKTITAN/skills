<svg xmlns="http://www.w3.org/2000/svg" id="kheskills-map" viewBox="0 0 896 344" role="img" aria-labelledby="kheskills-map-title kheskills-map-desc">
  <title id="kheskills-map-title">How the skills hand off to each other</title>
  <desc id="kheskills-map-desc">khe-auto routes every request; inside it, five hand-offs run one skill after another.</desc>
  <defs>
    <marker id="kheskills-map-arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path class="head" d="M0 1 L8 4 L0 7 Z"/>
    </marker>
  </defs>
  <style>
    #kheskills-map { --paper: #fff; --ink: #262628; --muted: #6e6e73; --soft: rgba(38,38,40,0.04); --rule: rgba(0,0,0,0.08); --accent: #3b82f6; --accent-tint: rgba(59,130,246,0.12); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      #kheskills-map { --paper: #0d1117; --ink: #e6edf3; --muted: #9198a1; --soft: rgba(230,237,243,0.05); --rule: rgba(255,255,255,0.1); --accent: #4c8dff; --accent-tint: rgba(76,141,255,0.16); }
    }
    #kheskills-map .paper { fill: var(--paper); }
    #kheskills-map .zone { fill: none; stroke: var(--muted); stroke-opacity: 0.4; stroke-dasharray: 2 4; }
    #kheskills-map .zone-name { fill: var(--ink); font-size: 12px; font-weight: 600; }
    #kheskills-map .zone-sub { fill: var(--muted); font-size: 10px; }
    #kheskills-map .edge { fill: none; stroke: var(--muted); }
    #kheskills-map .head { fill: var(--muted); }
    #kheskills-map .mask { fill: var(--paper); }
    #kheskills-map .label { fill: var(--muted); font-size: 9px; }
    #kheskills-map .node rect { fill: var(--paper); stroke: var(--ink); }
    #kheskills-map .external rect { fill: var(--soft); stroke: var(--muted); stroke-dasharray: 5 4; }
    #kheskills-map .focal rect { fill: var(--accent-tint); stroke: var(--accent); }
    #kheskills-map .name { fill: var(--ink); font-size: 12px; font-weight: 600; }
    #kheskills-map .sub { fill: var(--muted); font-size: 10px; }
    #kheskills-map .legend text { fill: var(--muted); font-size: 10px; }
    #kheskills-map .legend .rule { stroke: var(--rule); }
  </style>
  <rect class="paper" width="896" height="344"/>
  <rect class="zone" x="32" y="24" width="832" height="248" rx="6"/>
  <text class="zone-name" x="48" y="48">khe-auto</text>
  <text class="zone-sub" x="112" y="48">routes every request to the skill that owns it, and runs these hand-offs in order</text>
  <g class="edges">
    <path class="edge" d="M192 108 H272" marker-end="url(#kheskills-map-arrow)"/>
    <path class="edge" d="M480 108 H400" marker-end="url(#kheskills-map-arrow)"/>
    <path class="edge" d="M192 212 H272" marker-end="url(#kheskills-map-arrow)"/>
    <path class="edge" d="M400 212 H480" marker-end="url(#kheskills-map-arrow)"/>
    <path class="edge" d="M688 212 H608" marker-end="url(#kheskills-map-arrow)"/>
  </g>
  <g class="labels">
    <rect class="mask" x="196" y="84" width="72" height="14"/>
    <text class="label" x="200" y="94">contract first</text>
    <rect class="mask" x="408" y="84" width="64" height="14"/>
    <text class="label" x="412" y="94">then the look</text>
    <rect class="mask" x="208" y="188" width="48" height="14"/>
    <text class="label" x="212" y="198">one take</text>
    <rect class="mask" x="404" y="188" width="72" height="14"/>
    <text class="label" x="408" y="198">picture locked</text>
    <rect class="mask" x="612" y="188" width="72" height="14"/>
    <text class="label" x="616" y="198">reveal sound</text>
  </g>
  <g class="nodes">
    <g class="node">
      <rect x="64" y="80" width="128" height="56" rx="6"/>
      <text class="name" x="76" y="104">khe-design-tokens</text>
      <text class="sub" x="76" y="120">reads .design</text>
    </g>
    <g class="node focal">
      <rect x="272" y="80" width="128" height="56" rx="6"/>
      <text class="name" x="284" y="104">khe-ui</text>
      <text class="sub" x="284" y="120">builds and judges</text>
    </g>
    <g class="node external">
      <rect x="480" y="80" width="128" height="56" rx="6"/>
      <text class="name" x="492" y="104">ui-sdk</text>
      <text class="sub" x="492" y="120">Vercel, composes</text>
    </g>
    <g class="node">
      <rect x="64" y="184" width="128" height="56" rx="6"/>
      <text class="name" x="76" y="208">khe-demo</text>
      <text class="sub" x="76" y="224">records the app</text>
    </g>
    <g class="node">
      <rect x="272" y="184" width="128" height="56" rx="6"/>
      <text class="name" x="284" y="208">khe-launch-film</text>
      <text class="sub" x="284" y="224">plans and cuts</text>
    </g>
    <g class="node focal">
      <rect x="480" y="184" width="128" height="56" rx="6"/>
      <text class="name" x="492" y="208">khe-sound</text>
      <text class="sub" x="492" y="224">places each sound</text>
    </g>
    <g class="node">
      <rect x="688" y="184" width="128" height="56" rx="6"/>
      <text class="name" x="700" y="208">khe-svg</text>
      <text class="sub" x="700" y="224">vectors that move</text>
    </g>
  </g>
  <g class="legend" transform="translate(32 300)">
    <line class="rule" x1="0" y1="-16" x2="832" y2="-16"/>
    <text x="0" y="4">Work alone: khe-sticker, khe-diagram, khe-content-engine and the seven brains.</text>
    <text x="0" y="22">khe-poteto-pyramid and khe-package hand their deep parts to Lauren Tan's, Matt Pocock's and Emil Kowalski's skills, shown in their own READMEs.</text>
  </g>
</svg>
